plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

def localMavenDir = providers.environmentVariable("LOCAL_MAVEN_DIR").getOrElse(project.findProperty("localMavenDir") ?: "local-maven")

repositories {
	maven {
		name = 'LocalDDriveMaven'
		url = uri(localMavenDir)
	}
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'AliyunCentral'
		url = 'https://maven.aliyun.com/repository/central'
	}
	maven {
		name = 'MinecraftLibraries'
		url = 'https://libraries.minecraft.net/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	mavenCentral()
}

configurations.configureEach {
	exclude group: "com.github.oshi", module: "oshi-core"
	exclude group: "io.netty", module: "netty-transport-classes-epoll"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dawn_accessibility" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api-base:${project.fabric_api_base_version}"
	implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_version}"
	implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_key_mapping_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	clientCompileOnly files("${localMavenDir}/com/github/oshi/oshi-core/6.9.0/oshi-core-6.9.0.jar")
	clientCompileOnly files("${localMavenDir}/io/netty/netty-transport-classes-epoll/4.2.7.Final/netty-transport-classes-epoll-4.2.7.Final.jar")
	clientCompileOnly files("${localMavenDir}/it/unimi/dsi/fastutil/8.5.18/fastutil-8.5.18.jar")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = 'bJNYg6Np'
	versionNumber = project.mod_version
	versionName = "DawnGuiReader v${project.mod_version}"
	versionType = 'release'
	uploadFile = tasks.named('jar')
	gameVersions = ['26.1', '26.1.1', '26.1.2', '26.2']
	loaders = ['fabric']
	changelog = '''
- Added Minecraft 26.2 support while retaining Minecraft 26.1.x compatibility.
- Improved TTS threading and fallback behavior.
- Optimized GUI reading and disabled-state tick overhead.
- Added bilingual documentation and a new mod icon.
- Thanks to @S-H-Go for the Minecraft 26.2 compatibility contribution.
'''.stripIndent().trim()
	dependencies {
		required.project 'fabric-api'
		required.project 'cloth-config'
	}
}
