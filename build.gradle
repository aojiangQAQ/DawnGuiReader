plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'AliyunCentral'
		url = 'https://maven.aliyun.com/repository/central'
	}
	maven {
		name = 'MinecraftLibraries'
		url = 'https://libraries.minecraft.net/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dawn_accessibility" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = 'bJNYg6Np'
	versionNumber = project.mod_version
	versionName = "DawnGuiReader v${project.mod_version}"
	versionType = 'release'
	uploadFile = tasks.named('remapJar')
	gameVersions = ['1.20.1']
	loaders = ['fabric']
	changelog = '''
- Added a dedicated Minecraft 1.20.1 Fabric build.
- Includes container, hotbar, crosshair, GUI, and enchanting-table reading.
'''.stripIndent().trim()
	dependencies {
		required.project 'fabric-api'
		required.project 'cloth-config'
	}
}
