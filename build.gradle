plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

def localMavenDir = providers.environmentVariable("LOCAL_MAVEN_DIR").getOrElse(project.findProperty("localMavenDir") ?: "local-maven")

repositories {
	maven {
		name = 'LocalDDriveMaven'
		url = uri(localMavenDir)
	}
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'AliyunCentral'
		url = 'https://maven.aliyun.com/repository/central'
	}
	maven {
		name = 'MinecraftLibraries'
		url = 'https://libraries.minecraft.net/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dawn_accessibility" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api-base:${project.fabric_api_base_version}"
	implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_version}"
	implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_key_mapping_version}"
	runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = 'bJNYg6Np'
	versionNumber = project.mod_version
	versionName = "DawnGuiReader v${project.mod_version}"
	versionType = 'release'
	uploadFile = tasks.named('jar')
	gameVersions = ['26.3']
	loaders = ['fabric']
	changelog = '''
## English
- Added a dedicated Minecraft 26.3 Fabric build.
- Updated input handling for Minecraft's SDL backend.
- Fixed short key presses being missed, including shortcuts inside GUIs.
- Requires Java 25, Fabric Loader 0.19.5+, Fabric API for 26.3, and Cloth Config 26.3.159+ (Fabric).
- Existing builds for 26.1/26.2, 1.21.x, and 1.20.1 remain available separately. Do not use this JAR with those versions.

Validated client startup, settings at 4x GUI scale, keyboard/mouse GUI shortcuts, press/repeat handling, and rebinding. A full regression of in-world speech scenarios has not yet been completed.

## 简体中文
- 新增 Minecraft 26.3 专用 Fabric 构建，适配 SDL 输入后端。
- 修复快速短按可能被遗漏的问题；GUI 内可使用键盘和鼠标快捷键，长按不会重复触发。
- 需要 Java 25、Fabric Loader 0.19.5+、26.3 对应的 Fabric API 和 Cloth Config 26.3.159+（Fabric）。
- 26.1/26.2、1.21.x 和 1.20.1 的旧构建继续保留，请勿混用 JAR。

已验证客户端启动、4x GUI 缩放设置页、GUI 内键鼠快捷键、短按/长按和重新绑定；世界内全部朗读场景尚未完成完整回归。
'''.stripIndent().trim()
	dependencies {
		required.project 'fabric-api'
		required.project 'cloth-config'
	}
}
