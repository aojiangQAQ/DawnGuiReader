pluginManagement {
	def localMavenPath = providers.environmentVariable('LOCAL_MAVEN_DIR')
			.orElse(providers.gradleProperty('localMavenDir'))
			.getOrElse('local-maven')
	repositories {
		maven {
			name = 'LocalDDriveMaven'
			url = uri(localMavenPath)
		}
		maven {
			name = 'AliyunGradlePlugin'
			url = 'https://maven.aliyun.com/repository/gradle-plugin'
		}
		maven {
			name = 'AliyunPublic'
			url = 'https://maven.aliyun.com/repository/public'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

